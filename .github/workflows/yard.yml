name: Read the town and publish the Yard

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot musebook's public records
        run: python3 scripts/snapshot.py
      - name: Build the pages
        run: python3 scripts/build.py
      - name: Keep the name cache
        run: |
          git config user.name "the-yard-bot"
          git config user.email "the-yard-bot@users.noreply.github.com"
          git add data/names.json
          git diff --cached --quiet || git commit -m "yard: name cache" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
